<title>Client Update Letter</title>
<!--
  INTERNAL STYLE TEMPLATE — Client Update Letter — DO NOT HAND THIS FILE TO THE CUSTOMER.

  This is a template the AI READS, never a file the customer edits. The customer
  never opens this file, never pastes into it, and never touches its HTML.

  How the AI uses it (see workflows/fill-and-render.md):
   1. Read this file as the layout skeleton.
   2. Read branding/brand.md and substitute the letterhead (business name,
      contact line, primary color) from it — replacing the placeholders below.
   3. Drop the FINISHED, filled letter body straight into <div id="letter">,
      in place of the sample lines. HTML-escape every field value first:
      turn & into &amp;, < into &lt;, > into &gt; so names like "Smith & Co."
      or "<matter>" render correctly instead of breaking the page.
   4. Do NOT include the sender business name / street address at the top of the
      letter body — the letterhead above already carries the sender identity.
      The letter body starts at the date.
   5. The result goes into the VERIFICATION PAGE, not straight to disk. Clone
      references/verify-page.html, drop this rendered document into its
      FILL:DOCUMENT slot along with the checks and the provenance list, and
      write THAT as <name>-VERIFY.html into the customer's output folder
      (~/Documents/doc-factory/ by default). No releasable file exists until
      the customer ticks the box and clicks "I validate this and I want it";
      the clean printable document then downloads from that page.
      See workflows/fill-and-render.md Step 6.

  The bold section labels ("What we have completed", etc.) are emitted as real
  <strong> lines by the render step (see fill-and-render.md Step 3), so they are
  bold in the finished PDF regardless of how the letter was filled.
-->
<style>
  @page { size: letter; margin: 1in; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 11.5pt;
    line-height: 1.5;
    color: #1a1a1a;
  }
  .sheet {
    max-width: 6.5in;      /* 8.5in page minus 1in margins each side */
    margin: 0 auto;
    padding: 0.25in 0 0;
  }
  /* Letterhead — the AI swaps the color + name for the brand (branding/brand.md) */
  .letterhead {
    border-bottom: 2px solid #6b1f2a;   /* primary color */
    padding-bottom: 8px;
    margin-bottom: 24px;
  }
  .letterhead .name {
    font-size: 18pt;
    font-weight: bold;
    letter-spacing: 0.5px;
    color: #6b1f2a;                     /* primary color */
  }
  .letterhead .contact { font-size: 9.5pt; color: #555; margin-top: 2px; }
  #letter { white-space: pre-wrap; }    /* preserves the paragraph spacing exactly */
  #letter strong { font-weight: bold; } /* the section labels stay bold */
  strong, b { font-weight: bold; }
  @media print {
    body { font-size: 11.5pt; }
  }
</style>

<body>
  <div class="sheet">
    <!-- LETTERHEAD: the AI replaces this with the business name + contact line
         from branding/brand.md. This is the ONLY place the sender identity
         appears — the letter body below must NOT repeat the sender name/address.
         If the brand has a logo image, the AI puts
         <img src="logo.png" style="height:48px"> here instead of the name. -->

      <div class="name">{{sender business name}}</div>
      <div class="contact">{{sender contact line}}</div>
    </div>

    <!-- LETTER BODY: the AI drops the finished, HTML-escaped letter here,
         starting at the date. Section labels come in as <strong>…</strong>.
